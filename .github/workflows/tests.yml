name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  protocol-tests:
    # 測試對象是**評估協定**（分組留出不跨越、品質閘會響），不是模型準確率。
    # 協定寫錯不會有錯誤訊息，只會給出一個好看的數字——所以它才是該被 CI 守住的東西。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安裝相依（CPU 版 torch，CI 不需要 GPU）
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install numpy pillow scikit-learn scipy pytest
      - run: python -m pytest tests/ -q

  claim-discipline:
    # 宣稱規則寫死在程式裡是為了「避免事後看著 p 值挑形容詞」。
    # 這一關確保那條規則本身沒有被改鬆——判定字串與門檻必須維持原樣。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 判定門檻未被放寬
        run: |
          python - <<'PY'
          import re, sys, pathlib
          src = pathlib.Path("src/analyze_results.py").read_text(encoding="utf-8")
          for pattern, desc in [
              (r"if p < 0\.05:\s*\n\s*return \"可宣稱\"", "p<0.05 → 可宣稱"),
              (r"if p < 0\.10:\s*\n\s*return \"有跡象但不可宣稱\"", "p<0.10 → 有跡象但不可宣稱"),
              (r"return \"落在雜訊帶內\"", "其餘 → 落在雜訊帶內"),
          ]:
              if not re.search(pattern, src):
                  sys.exit(f"宣稱規則被改動：{desc} 不再成立")
          print("✓ 宣稱規則三段判定維持原樣")

          # 已落盤的結論必須與規則一致：p 值與判定字串不得互相矛盾
          import json
          a = json.loads(pathlib.Path("results/analysis.json").read_text(encoding="utf-8"))
          for m, d in a["metrics"].items():
              p, v = d["p_value"], d["verdict"]
              expect = "可宣稱" if p < 0.05 else ("有跡象但不可宣稱" if p < 0.10 else "落在雜訊帶內")
              if v != expect:
                  sys.exit(f"{m}: p={p} 應判 {expect}，實際寫的是 {v}")
          print("✓ results/analysis.json 的判定與 p 值一致")
          PY

      - name: 封存 test 只能在 sealed_eval.py 開封
        run: |
          python - <<'PY'
          import pathlib, sys
          # 開封紀錄的價值在於「grep 一次就列得完」。搜尋或 lr 掃描裡出現 unseal，
          # 代表超參是看著 test 挑的——那份結果作廢，而且不會有任何錯誤訊息。
          allowed = {"src/nested.py", "src/sealed_eval.py"}
          bad = [str(p) for p in pathlib.Path("src").glob("*.py")
                 if "unseal" in p.read_text(encoding="utf-8") and str(p) not in allowed]
          if bad:
              sys.exit(f"這些檔案不該開封 test：{bad}")
          print("✓ 開封只發生在 sealed_eval.py（定義在 nested.py）")
          PY

      - name: 超參挑選規則與延遲宣稱規則未被放寬
        run: |
          python - <<'PY'
          import json, pathlib, re, sys
          src = pathlib.Path("src/search.py").read_text(encoding="utf-8")
          if not re.search(r"^TIE_BAND_SD_MULT = 2\.0\b", src, re.M):
              sys.exit("同分帶寬度被改動——挑超參的規則必須跑之前就定案")
          for frag in ("訓練時間中位數最小者", "best_mean − 2.0 × 折間標準誤"):
              if frag not in src:
                  sys.exit(f"SELECTION_RULE 缺少「{frag}」")
          print("✓ 超參挑選規則維持原樣")

          lat = pathlib.Path("src/latency.py").read_text(encoding="utf-8")
          if 'NOT_PER_IMAGE = {"batch_amortized"}' not in lat:
              sys.exit("批次攤提不再被標為『不可當單筆延遲』——延遲宣稱會失守")
          print("✓ 批次攤提仍不得冒充單筆延遲")

          # 已落盤的 v2 結論同樣要與判定規則一致
          for f, path in (("final_eval.json", "results/final_eval.json"),
                          ("arch_results.json", "results/arch_results.json")):
              p = pathlib.Path(path)
              if not p.exists():
                  print(f"（{f} 尚未產出，略過）")
                  continue
              d = json.loads(p.read_text(encoding="utf-8"))
              cmps = list(d.get("comparison", {}).values())
              for block in d.get("vs_resnet18", {}).values():
                  cmps += list(block.values())
              for c in cmps:
                  want = ("可宣稱" if c["p_value"] < 0.05
                          else "有跡象但不可宣稱" if c["p_value"] < 0.10 else "落在雜訊帶內")
                  if c["verdict"] != want:
                      sys.exit(f"{f} {c['metric']}: p={c['p_value']} 應判 {want}，實際 {c['verdict']}")
              print(f"✓ {f} 的判定與 p 值一致（{len(cmps)} 組）")
          PY
